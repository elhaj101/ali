    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph. og:url and og:image must be absolute — LinkedIn's crawler
         does not reliably resolve relative paths. These point at the GitHub
         Pages URL; update all three if the site moves to another domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ali El Haj — Full-Stack Software Developer, Berlin" />
    <meta
      property="og:description"
      content="Full-stack software developer in Berlin specializing in Python/Django and React, with a focus on predictive analytics and machine learning."
    />
    <meta property="og:url" content="https://elhaj101.github.io/ali/" />
    <meta property="og:image" content="https://elhaj101.github.io/ali/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ali El Haj — Full-Stack Software Developer, Berlin" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ali El Haj — Full-Stack Software Developer, Berlin" />
    <meta
      name="twitter:description"
      content="Full-stack software developer in Berlin specializing in Python/Django and React, with a focus on predictive analytics and machine learning."
